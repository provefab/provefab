# Checks every push and pull request on Linux; on a v* tag, builds static
# Linux binaries and adds them to the GitHub release the owner created
# (Linux spec §6).
# Run by hand (workflow_dispatch), it builds, tests and packs both archives
# without a release, to prove the static builds before tagging.
# The notarized macOS zip is built by hand with scripts/release-macos.sh.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run; a
# tag run is never cancelled, and a manual run and a push never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup is on every GitHub runner: no third-party action to pin.
      - run: rustup toolchain install 1.96 --profile minimal --component rustfmt,clippy && rustup default 1.96
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo nextest run --all-features

  linux-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96 --profile minimal --target ${{ matrix.target }} && rustup default 1.96
      # A release binary is built from a clean target directory, never a cache.
      - uses: Swatinem/rust-cache@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: sudo apt-get update && sudo apt-get install -y musl-tools file
      - name: The tag is the crate's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="provefab"))')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME is not v$v" >&2; exit 1; }
      - name: Tests on the static x86_64 build
        if: matrix.arch == 'x86_64'
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          cargo nextest run --all-features --target ${{ matrix.target }}
      - run: cargo build --release --locked -p provefab --target ${{ matrix.target }}
      - run: scripts/package-linux.sh ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  linux-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The owner creates the release with the notarized macOS zip; this job
      # never creates one. It waits for it (every 30 s, up to 30 minutes),
      # then adds the Linux archives.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "no release $GITHUB_REF_NAME after 30 minutes: create it with the macOS zip, then re-run this job" >&2; exit 1; }
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
