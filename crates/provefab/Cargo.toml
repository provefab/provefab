[package]
name = "provefab"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agent-workers = { version = "0.1.0", path = "../agent-workers" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
humantime-serde = "1.1.1"
include_dir = "0.7.4"
jev = { version = "0.1.0", path = "../jev" }
libc = "0.2.189"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
shell-words = "1.1.1"
reqwest = { version = "0.13.5", features = ["json"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["process", "io-util", "time", "macros", "rt", "signal", "sync"] }
toml = "1.1.6"
tempfile = { version = "3.27.0", optional = true }

[features]
# Fakes and fixtures for pipeline tests, shared with Provefab Pro.
testkit = ["dep:tempfile"]

[dev-dependencies]
provefab = { path = ".", features = ["testkit"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
wiremock = "0.6.5"
